services:
  headscale:
    image: headscale/headscale:0.29.7
    command: serve
    environment:
      TZ: ${TZ}
      # No config file: headscale falls back to defaults + HEADSCALE_* env (viper AutomaticEnv).
      HEADSCALE_SERVER_URL: ${APP_PROTOCOL:-http}://${APP_DOMAIN}
      HEADSCALE_LISTEN_ADDR: 0.0.0.0:8080
      HEADSCALE_METRICS_LISTEN_ADDR: 127.0.0.1:9090
      HEADSCALE_NOISE_PRIVATE_KEY_PATH: /var/lib/headscale/noise_private.key
      HEADSCALE_PREFIXES_V4: 100.64.0.0/10
      HEADSCALE_PREFIXES_V6: fd7a:115c:a1e0::/48
      HEADSCALE_DATABASE_TYPE: sqlite
      HEADSCALE_DATABASE_SQLITE_PATH: /var/lib/headscale/db.sqlite
      HEADSCALE_DERP_URLS: ${HEADSCALE_DERP_MAP_URL}
      HEADSCALE_DNS_BASE_DOMAIN: ${HEADSCALE_BASE_DOMAIN}
      HEADSCALE_DNS_NAMESERVERS_GLOBAL: ${HEADSCALE_GLOBAL_NAMESERVERS}
      HEADSCALE_DISABLE_CHECK_UPDATES: "true"
    volumes:
      - ${APP_DATA_DIR}/data/lib:/var/lib/headscale
    tmpfs:
      - /var/run/headscale
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
    x-runtipi:
      internal_port: 8080
      is_main: true
x-runtipi:
  schema_version: 2

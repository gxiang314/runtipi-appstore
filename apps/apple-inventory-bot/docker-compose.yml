services:
  apple-inventory-bot:
    image: 'ghcr.io/gxiang314/apple-inventory-bot:0.1.1'
    # The image runs as a non-root user and ${APP_DATA_DIR} is owned by 1000 on
    # the host. These have to agree, or SQLite cannot create history.db in /data
    # and the container restart-loops on "unable to open database file".
    user: '1000:1000'
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_OWNER_ID=${TELEGRAM_OWNER_ID}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL}
      - LIST_URL=${APPLE_BOT_LIST_URL}
      - CRON_EXPR=${APPLE_BOT_CRON_EXPR}
      - PORT=17999
      - WATCH_CONFIG=/data/watch.yml
      - DB_PATH=/data/history.db
    volumes:
      - '${APP_DATA_DIR}/data:/data'
    x-runtipi:
      internal_port: 17999
      is_main: true
x-runtipi:
  schema_version: 2

services:
  copdszlib:
    image: ghcr.io/gxiang314/copdszlib:latest
    user: '1000:1000'
    environment:
      - OPDS_USER=${COPDS_USER}
      - OPDS_PASS=${COPDS_PASS}
      - BASE_URL=${COPDS_BASE_URL}
      - RECOMMEND_SOURCES=${COPDS_RECOMMEND_SOURCES:-douban,openlibrary,readmoo,kingstone,taaze}
      - PORT=3000
      - DB_PATH=/data/library.db
    volumes:
      - ${APP_DATA_DIR}/data:/data
    x-runtipi:
      internal_port: 3000
      is_main: true
x-runtipi:
  schema_version: 2

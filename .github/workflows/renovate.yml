name: Renovate
on:
  workflow_dispatch:
    inputs:
      log_level:
        type: choice
        description: Log level
        default: INFO
        options:
          - DEBUG
          - INFO
          - WARN
          - ERROR
          - FATAL
  schedule:
    - cron: 20 4 * * *

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun global packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/global
          key: ${{ runner.os }}-bun-global-renovate-40
          restore-keys: |
            ${{ runner.os }}-bun-global-

      - name: Install Renovate
        run: bun install -g renovate@40

      - name: Run renovate
        env:
          # 皆為可選：未設定時 Renovate 照常執行，只是少了 changelog / 較高的 Docker Hub 額度
          GITHUB_COM_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # postUpgradeTasks 執行任意指令，self-hosted 必須顯式允許
          RENOVATE_ALLOWED_COMMANDS: '["^bun install --frozen-lockfile$","^bun ./scripts/update-config.ts .+$","^bunx @biomejs/biome check --write$","^bun run test$"]'
        run: LOG_LEVEL=${{ github.event.inputs.log_level || 'INFO' }} renovate --token ${{ steps.app-token.outputs.token }} ${{ github.repository }}

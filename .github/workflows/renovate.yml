name: Renovate
on:
  workflow_dispatch:
    inputs:
      log_level:
        type: choice
        description: Log level
        default: INFO
        options:
          - DEBUG
          - INFO
          - WARN
          - ERROR
          - FATAL
  schedule:
    - cron: 20 4 * * *

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun global packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/global
          key: ${{ runner.os }}-bun-global-renovate-40
          restore-keys: |
            ${{ runner.os }}-bun-global-

      - name: Install Renovate
        run: bun install -g renovate@40

      # 273 個 app ≈ 600 次 registry 查詢，無快取會撞上 Docker Hub 429 並中止整輪更新
      - name: Cache Renovate lookups
        uses: actions/cache@v6
        with:
          path: /tmp/renovate-cache
          key: renovate-cache-${{ github.run_id }}
          restore-keys: |
            renovate-cache-

      - name: Run renovate
        env:
          # 皆為可選：未設定時 Renovate 照常執行，只是少了 changelog / 較高的 Docker Hub 額度
          GITHUB_COM_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # postUpgradeTasks 執行任意指令，self-hosted 必須顯式允許
          RENOVATE_ALLOWED_COMMANDS: '["^bun install --frozen-lockfile$","^bun ./scripts/update-config.ts .+$","^bunx @biomejs/biome check --write$","^bun run test$"]'
          RENOVATE_CACHE_DIR: /tmp/renovate-cache
          # 有設就用 Redis 做跨執行快取（首選）；沒設則退回上面的 actions/cache 檔案快取
          RENOVATE_REDIS_URL: ${{ secrets.RENOVATE_REDIS_URL }}
          # hostRules 是 self-hosted 專用，放在 renovate.json 會被忽略。
          # abortOnError:false 讓單一 image 的 429 只跳過該 image，而非中止整輪更新。
          RENOVATE_HOST_RULES: '[{"hostType":"docker","abortOnError":false,"concurrentRequestLimit":8}]'
        run: LOG_LEVEL=${{ github.event.inputs.log_level || 'INFO' }} renovate --token ${{ steps.app-token.outputs.token }} ${{ github.repository }}
